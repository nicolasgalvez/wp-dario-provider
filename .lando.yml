name: wp-dario-test
recipe: lamp

config:
  php: '8.3'
  webroot: wordpress
  database: mariadb

services:
  appserver:
    type: php:8.3
    build_as_root:
      - apt-get update -qq && apt-get install -y -qq unzip curl ca-certificates gnupg default-mysql-client > /dev/null 2>&1
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1
      - apt-get install -y -qq nodejs > /dev/null 2>&1
      - curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp
      - chmod +x /usr/local/bin/wp
      - |
        WP_DIR=/app/wordpress
        if [ ! -f "$WP_DIR/wp-load.php" ]; then
          echo "Downloading WordPress 7.0 RC4 (no default themes/plugins)..."
          mkdir -p "$WP_DIR"
          # --skip-content omits the bundled wp-content/plugins (Akismet, Hello Dolly)
          # and wp-content/themes (Twenty*). Keeps the install minimal and reproducible.
          wp core download --version=7.0-RC4 --path="$WP_DIR" --skip-content --allow-root
          echo "WordPress 7.0 RC4 extracted."
        fi
        # Ensure the appserver (non-root) user owns wp-content so the build block
        # can mkdir inside wp-content/plugins. On macOS Docker this happens by
        # default through volume permissions; on Linux runners (GHA) it doesn't.
        chown -R www-data:www-data "$WP_DIR/wp-content" || true
    build:
      # Use rsync --delete to keep the deployed plugin dir in sync with the
      # source tree. Idempotent: avoids the cp -r src/ -> dest/src/src/
      # nesting bug that occurs when the destination dir already exists,
      # and removes files that no longer exist in the source.
      - |
        PLUGIN_DIR=/app/wordpress/wp-content/plugins/procyon-dario-provider
        mkdir -p "$PLUGIN_DIR"
        rsync -a --delete /app/src/ "$PLUGIN_DIR/src/"
        rsync -a --delete /app/sidecar/ "$PLUGIN_DIR/sidecar/"
        rsync -a --delete /app/assets/ "$PLUGIN_DIR/assets/"
        rsync -a --delete /app/vendor/ "$PLUGIN_DIR/vendor/" 2>/dev/null || true
        rsync -a --delete /app/node_modules/ "$PLUGIN_DIR/node_modules/" 2>/dev/null || true
        cp /app/procyon-dario-provider.php "$PLUGIN_DIR/"
        cp /app/plugin.json "$PLUGIN_DIR/"
        cp /app/package.json "$PLUGIN_DIR/"
        cp /app/package-lock.json "$PLUGIN_DIR/"
        cp /app/readme.txt "$PLUGIN_DIR/"
        cp /app/composer.json "$PLUGIN_DIR/" 2>/dev/null || true
    run:
      # Idempotent WP setup: configures, installs core, installs the latest
      # default theme, and activates this plugin. Runs on every `lando start`
      # and `lando rebuild`. Skips work that's already done so subsequent
      # starts are fast. The Lando MariaDB recipe pre-creates the `wordpress`
      # database, so we skip `wp db create` (which also dies on TLS/SSL with
      # the default mariadb client config).
      - |
        set -e
        cd /app/wordpress
        if [ ! -f wp-config.php ]; then
          echo "Generating wp-config.php..."
          wp config create \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=database \
            --skip-check \
            --force
        fi
        if ! wp core is-installed --quiet 2>/dev/null; then
          echo "Installing WordPress core..."
          wp core install \
            --url=http://wp-dario-test.lndo.site \
            --title="Dario Test" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.com \
            --skip-email
          echo "WordPress installed: http://wp-dario-test.lndo.site/wp-admin (admin/admin)"
        fi
        if ! wp theme list --field=name 2>/dev/null | grep -q .; then
          echo "Installing default theme (twentytwentyfive)..."
          wp theme install twentytwentyfive --activate
        fi
        if ! wp plugin is-active procyon-dario-provider 2>/dev/null; then
          wp plugin activate procyon-dario-provider
        fi
        # Required test/dev companions:
        #   - `ai` is the wp.org consumer plugin we use to verify end-to-end
        #     integration (Title Generation ability routes through DarioProvider).
        #   - `plugin-check` is the official PCP tool the CI gate runs.
        # Both are installed from wp.org if missing and activated. Idempotent.
        for slug in ai plugin-check; do
          if ! wp plugin is-installed "$slug" 2>/dev/null; then
            echo "Installing $slug..."
            wp plugin install "$slug" --activate
          elif ! wp plugin is-active "$slug" 2>/dev/null; then
            wp plugin activate "$slug"
          fi
        done
    overrides:
      environment:
        WP_DB_HOST: database
        WP_DB_NAME: wordpress
        WP_DB_USER: wordpress
        WP_DB_PASSWORD: wordpress
        DARIO_BASE_URL: http://127.0.0.1:3456/v1

  database:
    type: mariadb:10.6
    creds:
      user: wordpress
      password: wordpress
      database: wordpress

  pma:
    type: phpmyadmin
    hosts:
      - database

proxy:
  pma:
    - pma-wp-dario-test.lndo.site

tooling:
  wp:
    service: appserver
    cmd: wp --path=/app/wordpress
  deploy-plugin:
    service: appserver
    description: Copy plugin files into WP plugins dir (use after editing src/)
    cmd:
      - |
        PLUGIN_DIR=/app/wordpress/wp-content/plugins/procyon-dario-provider
        mkdir -p "$PLUGIN_DIR"
        rsync -a --delete /app/src/ "$PLUGIN_DIR/src/"
        rsync -a --delete /app/sidecar/ "$PLUGIN_DIR/sidecar/"
        rsync -a --delete /app/assets/ "$PLUGIN_DIR/assets/"
        rsync -a --delete /app/vendor/ "$PLUGIN_DIR/vendor/"
        rsync -a --delete /app/node_modules/ "$PLUGIN_DIR/node_modules/"
        cp /app/procyon-dario-provider.php "$PLUGIN_DIR/"
        cp /app/plugin.json "$PLUGIN_DIR/"
        cp /app/package.json "$PLUGIN_DIR/"
        cp /app/package-lock.json "$PLUGIN_DIR/"
        cp /app/readme.txt "$PLUGIN_DIR/"
        cp /app/composer.json "$PLUGIN_DIR/"
        echo "Plugin deployed."
  dario:
    service: appserver
    description: Run the bundled Dario CLI from the installed plugin
    cmd: /app/wordpress/wp-content/plugins/procyon-dario-provider/node_modules/.bin/dario
