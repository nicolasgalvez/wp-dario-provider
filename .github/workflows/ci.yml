name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-progress --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: PHP lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Node syntax check
        run: |
          node --check sidecar/dario-sidecar.mjs
          node --check sidecar/dario-auth.mjs

      - name: Install wp-cli + download WordPress (for tests that require php-ai-client)
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          /tmp/wp core download --version=7.0-RC4 --path=wordpress --skip-content

      - name: npm test
        run: npm test

  integration:
    name: Lando boot + WP install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-progress --optimize-autoloader --no-dev

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Setup Lando
        uses: lando/setup-lando@v3

      - name: lando start
        run: lando start

      - name: Wait for WP install (run-block idempotency)
        run: |
          for i in $(seq 1 60); do
            if lando wp core is-installed --quiet 2>/dev/null; then
              echo "WP installed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "WP did not install in time"
          exit 1

      - name: Verify dry plugin list (only wp-dario-provider)
        run: |
          PLUGINS=$(lando wp plugin list --field=name | tr -d '\r' | sort -u | grep -v '^$')
          echo "Installed plugins:"
          echo "$PLUGINS"
          if [ "$PLUGINS" != "wp-dario-provider" ]; then
            echo "::error::Expected only wp-dario-provider, got: $PLUGINS"
            exit 1
          fi

      - name: Verify wp-dario-provider is active
        run: lando wp plugin is-active wp-dario-provider

      - name: Verify default theme installed and active
        run: |
          ACTIVE=$(lando wp theme list --status=active --field=name | tr -d '\r' | head -1)
          echo "Active theme: $ACTIVE"
          if [ -z "$ACTIVE" ]; then
            echo "::error::No active theme"
            exit 1
          fi

      - name: Plugin Check (excluding deferred exceptions)
        run: |
          lando wp plugin install plugin-check --activate
          # Excluded code list mirrors docs/plugin-check.md "Deferred exceptions" section.
          # If a new error appears outside this list, the step fails and the new
          # error must be either fixed or explicitly added here + documented.
          IGNORE_CODES="WordPress.WP.AlternativeFunctions.unlink_unlink"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_chmod"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_mkdir"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_fclose"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.rename_rename"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_is_writable"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_fopen"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_fwrite"
          IGNORE_CODES="$IGNORE_CODES,WordPress.WP.AlternativeFunctions.file_system_operations_fsockopen"
          OUTPUT=$(lando wp plugin check wp-dario-provider \
            --exclude-checks=plugin_updater \
            --ignore-codes="$IGNORE_CODES" \
            --ignore-warnings \
            --format=json 2>&1)
          if [ -n "$OUTPUT" ]; then
            echo "::error::Plugin Check found new errors outside the documented exception list"
            echo "$OUTPUT"
            echo ""
            echo "If these are intentional, add the codes to docs/plugin-check.md and to the IGNORE_CODES list in ci.yml."
            exit 1
          fi
          echo "✓ Plugin Check clean (excluding documented deferred exceptions)"

      - name: Show Lando logs on failure
        if: failure()
        run: |
          lando logs || true
          lando ssh -s appserver -c 'cat /app/wordpress/wp-content/dario-provider/dario-sidecar.log 2>/dev/null || true' || true
