name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Single job that runs the same `npm run check` a developer runs locally:
#   npm run lint        php -l + node --check
#   npm test            PHP unit tests
#   npm run check:pcp   Plugin Check via Lando (requires lando start first)
#
# No CI-only assertions. If `npm run check` passes locally, this job passes.

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-progress --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install wp-cli + download WordPress (for tests that require php-ai-client)
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          /tmp/wp core download --version=7.0-RC4 --path=wordpress --skip-content

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Setup Lando
        uses: lando/setup-lando@v3

      - name: lando start
        run: lando start

      - name: Plugin Check
        run: npm run check:pcp

      - name: Show Lando logs on failure
        if: failure()
        run: |
          lando logs || true
          lando ssh -s appserver -c 'cat /app/wordpress/wp-content/dario-provider/dario-sidecar.log 2>/dev/null || true' || true
