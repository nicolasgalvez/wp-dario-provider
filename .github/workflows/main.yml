name: Build and Zip WordPress Plugin
env:
  PLUGIN_NAME: procyon-dario-provider
  # In case any action used here still ships Node 20 internally, force them
  # under Node 24 (Node 20 is removed from runners on 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions:
  contents: write
on:
  # Only build on release publish. Previously this also fired on `push: tags v*`,
  # which races: pushing the tag before `gh release create` runs the workflow
  # against a release that doesn't exist yet, and the upload step fails. The
  # release-published event handles both tag and release in one shot.
  release:
    types: [published]
  push:
    branches:
      - 'test'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Create plugin zip
        run: |
          mkdir -p /tmp/$PLUGIN_NAME
          cp -r src/ /tmp/$PLUGIN_NAME/src/
          cp -r sidecar/ /tmp/$PLUGIN_NAME/sidecar/
          cp -r assets/ /tmp/$PLUGIN_NAME/assets/
          cp -r vendor/ /tmp/$PLUGIN_NAME/vendor/
          cp -r node_modules/ /tmp/$PLUGIN_NAME/node_modules/
          cp procyon-dario-provider.php /tmp/$PLUGIN_NAME/
          cp plugin.json /tmp/$PLUGIN_NAME/
          cp package.json /tmp/$PLUGIN_NAME/
          cp package-lock.json /tmp/$PLUGIN_NAME/
          cp readme.txt /tmp/$PLUGIN_NAME/
          cp LICENSE /tmp/$PLUGIN_NAME/ 2>/dev/null || true
          test -f /tmp/$PLUGIN_NAME/vendor/autoload.php
          test -f /tmp/$PLUGIN_NAME/node_modules/@askalf/dario/dist/index.js
          cd /tmp
          zip -r $GITHUB_WORKSPACE/$PLUGIN_NAME.zip $PLUGIN_NAME/

      - name: Upload Release Asset
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} ./$PLUGIN_NAME.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
